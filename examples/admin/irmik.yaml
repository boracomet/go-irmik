app:
  name: admin-demo
  env: development
  baseURL: http://127.0.0.1:8080

server:
  host: 127.0.0.1
  port: 8080

session:
  driver: memory
  name: irmik_session
  maxAge: 24h
  sameSite: lax

auth:
  jwtIssuer: irmik-admin-demo
  accessTTL: 1h
  # jwtSecret overridden in main for local demo (or set IRMIK_JWT_SECRET)

database:
  driver: sqlite
  dsn: file:irmik-admin-demo?mode=memory&cache=shared

cache:
  driver: memory

islands:
  enabled: false
